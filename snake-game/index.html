<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Snake Game</h1>
    <div class="info">
      <span id="score">Score: 0</span>
      <button id="restart">Restart</button>
    </div>
    <!-- Game drawing surface (HTML5 Canvas). JS renders the grid, snake and food here. -->
    <canvas id="game" width="400" height="400"></canvas>
    <p class="hint">Use arrow keys or WASD to move. Don't run into walls or yourself.</p>
  </div>
  <!-- Main game logic -->
  <script src="script.js"></script>
</body>
</html>
